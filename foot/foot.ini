# Dynamic island style terminal: black background, lots of air,
# no frames, no header, thin carriage. Theme colors are connected by file
# theme, which overwrites switch_theme.sh.
# ~ instead of the home path: the file goes to everyone, and someone else’s /home/<name> is in it
# I would break include for everyone except the author.
include=~/.config/foot/theme
# The second file is written by the shell itself, and it comes after the first: on the topic Nothing
# the background of the terminal should match the widget cards, and the general palette should be
# doesn't know the topics. The order is important - the one connected later wins.
# The file is created the first time the shell is launched; empty it doesn't change anything.
include=~/.config/foot/panacea-theme

[main]
shell=/usr/bin/fish
font=JetBrainsMono Nerd Font:size=16
# We don’t set line spacing: 16th point has its own metrics, manual value
# was adjusted to the small font and flattened the lines
# spacious fields - like indents inside a pill
pad=22x18 center
selection-target=clipboard

[cursor]
# thin vertical carriage instead of a fat block
style=beam
beam-thickness=1
blink=yes
blink-rate=600

# There is no one to draw a frame and a title and there is no need to draw it: the window is already rounded
# by Hyprland
[csd]
preferred=none

[scrollback]
lines=10000
indicator-position=none

# alpha lives in the same section as theme colors: separate [colors]
# is marked obsolete and complains when launched.
#
# The section is taken only when the portal reports color-scheme=prefer-dark.
# With “default” foot silently remained on its gray 242424 - therefore
# switch_theme.sh also sets the dark theme in gsettings.
[colors-dark]
# Opaque, and that's not a typo.
#
# The transparency of the terminal is controlled by the slider in the shell settings, and
# he does this by a linker rule: the foot itself rereads the config only
# on startup, and the slider would not change anything in the open window. Own alpha
# here it would be multiplied with the rule - at the unit of the slider the window is still
# would remain translucent, and “opaque” would be unattainable.
alpha=1.0

[mouse]
hide-when-typing=yes

# Пользовательские переопределения (шрифт, поля, горячие клавиши и т.д.).
# Значения в custom.ini побеждают параметры выше и сохраняются при обновлениях.
[main]
include=~/.config/foot/custom.ini
